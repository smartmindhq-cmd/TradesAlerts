name: Entry Alert

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:        # manual trigger for testing

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Check price and alert on entry
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          python3 << 'EOF'
          import os, urllib.request, urllib.parse, json, sys

          TG_BOT  = os.environ['TG_BOT']
          TG_CHAT = os.environ['TG_CHAT']

          TELEGRAPH_TOKEN = '3b1de5932b4fe8d5419e374f031e06193e41264cb35a9a0350fed79db35a'
          TELEGRAPH_PAGE  = 'XAUUSD-Cloud-State-05-17'

          # ── Telegraph state helpers ───────────────────────────────────
          def read_state():
              try:
                  req = urllib.request.Request(
                      f'https://api.telegra.ph/getPage/{TELEGRAPH_PAGE}?return_content=true',
                      headers={'User-Agent': 'Mozilla/5.0'}
                  )
                  with urllib.request.urlopen(req, timeout=10) as r:
                      data = json.loads(r.read())
                  content = data.get('result', {}).get('content', [])
                  for node in content:
                      if isinstance(node, dict) and node.get('tag') == 'p':
                          children = node.get('children', [])
                          if children and isinstance(children[0], str):
                              return json.loads(children[0])
              except Exception as e:
                  print(f'Telegraph read failed: {e}')
              return {}

          def write_state(state):
              try:
                  content = json.dumps([{"tag": "p", "children": [json.dumps(state)]}])
                  body = urllib.parse.urlencode({
                      'access_token': TELEGRAPH_TOKEN,
                      'path': TELEGRAPH_PAGE,
                      'title': 'XAUUSD Cloud State',
                      'content': content
                  }).encode()
                  req = urllib.request.Request(
                      'https://api.telegra.ph/editPage',
                      data=body,
                      headers={'Content-Type': 'application/x-www-form-urlencoded'}
                  )
                  with urllib.request.urlopen(req, timeout=10) as r:
                      result = json.loads(r.read())
                  if not result.get('ok'):
                      print(f'Telegraph write failed: {result}')
              except Exception as e:
                  print(f'Telegraph write error: {e}')

          # ── Read current setup from cloud state ───────────────────────
          state = read_state()
          print(f'Cloud state: {state}')

          entry_raw = state.get('ent')
          sl_raw    = state.get('sl')
          tp_raw    = state.get('tp')
          sym       = state.get('sym', 'GC%3DF')   # Yahoo Finance ticker
          direction = state.get('dir', 'Short')

          if not entry_raw or not sl_raw or not tp_raw:
              print('No setup synced yet — mark a trade on TradingView and monitor.js will sync it')
              sys.exit(0)

          ENTRY    = float(entry_raw)
          SL       = float(sl_raw)
          TP       = float(tp_raw)
          IS_SHORT = direction.lower() != 'long'

          SL_PTS = abs(SL - ENTRY)
          TP_PTS = abs(ENTRY - TP)
          RR     = round(TP_PTS / SL_PTS, 2) if SL_PTS > 0 else 0

          print(f'Setup: {direction} | Entry {ENTRY} | SL {SL} | TP {TP} | R:R 1:{RR} | Sym {sym}')

          # ── Fetch live price ──────────────────────────────────────────
          price = None
          for host in ['query2', 'query1']:
              try:
                  req = urllib.request.Request(
                      f'https://{host}.finance.yahoo.com/v8/finance/chart/{sym}?interval=1m&range=1d',
                      headers={'User-Agent': 'Mozilla/5.0'}
                  )
                  with urllib.request.urlopen(req, timeout=10) as r:
                      resp = json.loads(r.read())
                  price = resp['chart']['result'][0]['meta']['regularMarketPrice']
                  if price:
                      break
              except Exception as e:
                  print(f'Price fetch failed ({host}): {e}')

          if not price or price < 100:
              print(f'Invalid price: {price}')
              sys.exit(0)

          print(f'Live price: {price:.2f}')

          # ── Entry logic (handles SHORT and LONG) ──────────────────────
          entry_triggered = (price <= ENTRY) if IS_SHORT else (price >= ENTRY)
          reset_flag      = (price > ENTRY + 5) if IS_SHORT else (price < ENTRY - 5)

          if reset_flag:
              if state.get('ghET'):
                  state['ghET'] = False
                  write_state(state)
                  print('Price moved away from entry — reset ghET')
              else:
                  print('Price not at entry — no action')
              sys.exit(0)

          if entry_triggered:
              if state.get('ghET'):
                  print('Entry already alerted (ghET=True) — skipping')
                  sys.exit(0)

              sl_side  = 'above' if IS_SHORT else 'below'
              tp_side  = 'below' if IS_SHORT else 'above'
              profit   = (ENTRY - price) if IS_SHORT else (price - ENTRY)
              to_tp    = abs(price - TP)
              to_sl    = abs(price - SL)
              sym_name = 'XAUUSD (Gold)' if 'GC' in sym else sym.replace('%3D', '=')

              msg = (
                  f'🔔 ENTRY TRIGGERED — ReiMrmoney 👋\n'
                  f'Trade is now LIVE. Price crossed your entry.\n\n'
                  f'📍 {sym_name} · {direction} — live {price:.2f}\n\n'
                  f'YOUR MARKED SETUP:\n'
                  f'• Entry {ENTRY:.2f}\n'
                  f'• SL    {SL:.2f}  (+{SL_PTS:.1f} pts {sl_side} entry)\n'
                  f'• TP    {TP:.2f}  (-{TP_PTS:.1f} pts {tp_side} entry)\n'
                  f'• R:R ≈ 1:{RR}\n'
                  f'• Status: 🟢 TRADE LIVE — +{profit:.1f} pts in profit\n'
                  f'• To TP: {to_tp:.1f} pts | To SL: {to_sl:.1f} pts'
              )

              payload = json.dumps({'chat_id': TG_CHAT, 'text': msg}).encode()
              req = urllib.request.Request(
                  f'https://api.telegram.org/bot{TG_BOT}/sendMessage',
                  data=payload,
                  headers={'Content-Type': 'application/json'},
                  method='POST'
              )
              with urllib.request.urlopen(req, timeout=10) as r:
                  result = json.loads(r.read())

              if result.get('ok'):
                  print(f'✅ Alert sent! Price: {price:.2f}')
                  state['ghET'] = True
                  write_state(state)
              else:
                  print(f'❌ Telegram failed: {result}')
                  sys.exit(1)
          else:
              print(f'Price {price:.2f} not yet at entry {ENTRY} — watching')
          EOF
